name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail_demo:
        description: "Run the deliberately vulnerable fail-demo path"
        type: boolean
        default: false

permissions:
  contents: read

jobs:

  # ===============================================================
  # STAGE 1 - SOFTWARE COMPOSITION ANALYSIS
  # ===============================================================
  sca:
    name: "1 - SCA (pip-audit)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit real dependencies
        if: ${{ github.event.inputs.fail_demo != 'true' }}
        run: pip-audit -r requirements.txt

      - name: Audit vulnerable demo dependencies
        if: ${{ github.event.inputs.fail_demo == 'true' }}
        run: pip-audit -r security/requirements-vulnerable-demo.txt


  # ===============================================================
  # STAGE 2 - STATIC APPLICATION SECURITY TESTING
  # ===============================================================
  sast:
    name: "2 - SAST (Bandit)"
    needs: sca
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Scan real source code
        if: ${{ github.event.inputs.fail_demo != 'true' }}
        run: bandit -r src api -ll

      - name: Scan vulnerable demo
        if: ${{ github.event.inputs.fail_demo == 'true' }}
        run: bandit -r src api security/fail_demo -ll


  # ===============================================================
  # STAGE 3 - UNIT AND INTEGRATION TESTING
  # ===============================================================
  test:
    name: "3 - Unit & Integration Tests (pytest)"
    needs: sast
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python3 -m pytest tests/ -v --junitxml=pytest-results.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml


  # ===============================================================
  # STAGE 4 - BUILD / IMPORT CHECK
  # ===============================================================
  build:
    name: "4 - Build"
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Verify application imports
        run: |
          python3 -c "import api.server; import src.pipeline; print('build OK')"


  # ===============================================================
  # STAGE 5 - DYNAMIC APPLICATION SECURITY TESTING
  # ===============================================================
  dast:
    name: "5 - DAST (Custom Scanner + OWASP ZAP)"
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: pip install -r requirements.txt

      # -----------------------------------------------------------
      # Custom DAST scanner
      # -----------------------------------------------------------
      - name: Run custom DAST scanner
        if: ${{ github.event.inputs.fail_demo != 'true' }}
        run: python3 security/dast_scan.py

      - name: Run DAST failure demonstration
        if: ${{ github.event.inputs.fail_demo == 'true' }}
        run: python3 security/dast_scan.py --fail-demo

      # -----------------------------------------------------------
      # Start Flask application
      # -----------------------------------------------------------
      - name: Start application
        if: ${{ github.event.inputs.fail_demo != 'true' }}
        run: |
          nohup python3 -c "from api.server import serve; serve(host='0.0.0.0')" > app.log 2>&1 &
          sleep 5

      # -----------------------------------------------------------
      # Check application is running
      # -----------------------------------------------------------
      - name: Check application health
        if: ${{ github.event.inputs.fail_demo != 'true' }}
        run: |
          curl --fail http://localhost:5000/health

      # -----------------------------------------------------------
      # OWASP ZAP baseline scan
      # ZAP findings are recorded but do not block the pipeline.
      # -----------------------------------------------------------
      - name: OWASP ZAP Baseline Scan
        if: ${{ github.event.inputs.fail_demo != 'true' }}
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: "http://localhost:5000/health"
          fail_action: false
          allow_issue_writing: false


  # ===============================================================
  # STAGE 6 - DEPLOYMENT
  # ===============================================================
  deploy:
    name: "6 - Deploy (Simulated)"
    needs: dast
    if: ${{ github.event.inputs.fail_demo != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deployment confirmation
        run: |
          echo "=========================================="
          echo "ALL DEVSECOPS GATES PASSED"
          echo "Safe to proceed to deployment."
          echo "=========================================="
